name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: python -m unittest discover -s tests -v
      - run: npm run test:ui
      - run: npm run build
      - run: python scripts/package.py
      - name: Stage release artifacts
        shell: python
        run: |
          from pathlib import Path
          import shutil
          target = Path('artifacts')
          target.mkdir(exist_ok=True)
          for asset in Path('..').glob('Decky-Eclipse-v*.zip*'):
              shutil.copy2(asset, target / asset.name)
      - uses: actions/upload-artifact@v7
        with:
          name: decky-eclipse-${{ matrix.os }}
          path: |
            artifacts/Decky-Eclipse-v*.zip
            artifacts/Decky-Eclipse-v*.zip.sha256
          if-no-files-found: error
